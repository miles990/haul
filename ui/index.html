<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haul</title>
<style>
  :root {
    color-scheme: dark;
    --rack:  #1b1f24;
    --panel: #23282f;
    --sunk:  #171b20;
    --edge:  #31383f;
    --ink:   #e6e9ec;
    --dim:   #8c959e;
    --lamp:  #e8a33d;
    --pass:  #6fbf8b;
    --fail:  #c4564b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
            "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--rack);
    color: var(--ink);
    font: 400 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- 輸入區
     視窗標題列已經寫著 Haul，所以頁面裡不再放一次招牌，
     輸入欄直接當開場，垂直空間全留給佇列。 */

  .intake {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--edge);
  }

  .field {
    position: relative;
    background: var(--sunk);
    border: 1px solid var(--edge);
    border-radius: 5px;
    transition: border-color 0.15s;
  }

  .field:focus-within { border-color: var(--lamp); }

  .field.dropping { border-color: var(--lamp); background: #1c2126; }

  textarea {
    display: block;
    width: 100%;
    height: 78px;
    padding: 10px 12px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    resize: none;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  textarea::placeholder { color: #6c757e; }

  .row-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 10px 9px 12px;
  }

  .hint {
    margin: 8px 2px 0;
    font-size: 11.5px;
    color: var(--dim);
  }

  .hint.bad { color: var(--fail); }

  /* 影片 / 只要聲音 —— 分段切換，安靜地待在輸入欄底部 */
  select {
    margin-left: auto;
    margin-right: 10px;
    padding: 4px 6px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1 var(--sans);
  }

  select:hover { color: var(--ink); }

  .modes {
    display: flex;
    border: 1px solid var(--edge);
    border-radius: 4px;
    overflow: hidden;
  }

  .mode {
    border: 0;
    border-radius: 0;
    padding: 4px 11px;
    background: none;
    color: var(--dim);
    font: 500 12px/1 var(--sans);
  }

  .mode + .mode { border-left: 1px solid var(--edge); }
  .mode:hover:not(.on) { background: #2b3138; color: var(--ink); }
  .mode.on { background: #3a2d14; color: var(--lamp); }

  /* 首次啟動抓 yt-dlp 與 ffmpeg 時的進度；有新版時的提示也用同一條 */
  #setup, #update-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 18px 11px;
    border-bottom: 1px solid var(--edge);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
  }

  #update-bar { justify-content: space-between; }
  /* display:flex 會蓋過 hidden 屬性的預設樣式，得明講 */
  #setup[hidden], #update-bar[hidden] { display: none; }

  #setup .meter {
    flex: 1;
    min-width: 60px;
    height: 5px;
    background: var(--sunk);
    border-radius: 1px;
    overflow: hidden;
  }

  #setup .meter > i {
    display: block;
    width: 0;
    height: 100%;
    background: repeating-linear-gradient(90deg,
      var(--lamp) 0 3px, transparent 3px 5px);
    transition: width 0.2s linear;
  }

  button {
    padding: 5px 13px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--ink);
    font: 500 12.5px/1 var(--sans);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }

  button:hover:not(:disabled) { background: #2b3138; border-color: #3d454d; }
  button:active:not(:disabled) { background: #1f242a; }
  button:disabled { opacity: 0.45; cursor: default; }

  button.primary {
    border-color: #7a5a22;
    background: #3a2d14;
    color: var(--lamp);
  }
  button.primary:hover:not(:disabled) { background: #453518; border-color: #946c28; }

  /* 只給按鈕。textarea 的焦點已經由 .field:focus-within 的邊框表示，
     兩者都上就會出現兩層琥珀色框。 */
  button:focus-visible {
    outline: 2px solid var(--lamp);
    outline-offset: 1px;
  }

  /* ---------------------------------------------------------- 佇列 */

  #queue {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 4px 0;
  }

  /* margin:auto 在 column flex 裡會把唯一的子元素上下左右居中；
     一旦有曲目進來，.empty 隱藏，曲目就照常從頂端往下排 */
  .empty {
    margin: auto;
    padding: 0 18px;
    text-align: center;
    color: var(--dim);
    font-size: 12.5px;
  }

  /* 佇列／已完成兩個分頁。進行中的不該被舊項目淹掉，瀏覽舊項目時也不想看進度 */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 4px 18px 0;
    border-bottom: 1px solid var(--edge);
    background: var(--panel);
  }
  .tab {
    padding: 7px 10px 6px;
    border: 0;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    background: none;
    color: var(--dim);
    font: 500 12.5px/1 var(--sans);
  }
  .tab:hover:not(.on) { background: none; color: var(--ink); }
  .tab.on { color: var(--lamp); border-bottom-color: var(--lamp); }
  .tab b { margin-left: 3px; font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums; }

  .track {
    flex: none; /* 佇列變長時不要被 flex 壓扁 */
    position: relative;
    display: grid;
    grid-template-columns: 48px 1fr auto auto;
    grid-template-rows: auto auto;
    gap: 3px 14px;
    padding: 9px 18px 10px;
    border-bottom: 1px solid #262c33;
    background: var(--bg);
    transition: transform 0.15s ease-out, opacity 0.15s;
  }
  /* 移除時往左飛出去 */
  .track.gone { transform: translateX(-100%); opacity: 0; }

  /* 縮圖：列表要認得出誰是誰。還沒有縮圖時顯示型別圖示 */
  .thumb {
    grid-column: 1;
    grid-row: 1 / span 2;
    align-self: start;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 3px;
    background: var(--sunk);
    color: var(--dim);
    font-size: 17px;
    overflow: hidden;
  }
  .thumb img { display: none; width: 100%; height: 100%; object-fit: cover; }
  .thumb[data-kind="video"]::before { content: '▶'; }
  .thumb[data-kind="audio"]::before { content: '♪'; }
  .thumb[data-kind="image"]::before { content: '▣'; }
  /* 放在型別圖示之後：同權重時後者勝，縮圖到手就不再畫圖示 */
  .thumb.has::before { content: none; }
  .thumb.has img { display: block; }

  /* 原檔已不在：留著紀錄，但調暗、不再假裝點得開 */
  .track[data-missing] { opacity: 0.5; cursor: default; }
  .track[data-missing]:hover { background: none; }

  .name {
    grid-column: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }

  /* 來源網址：Finder 給不了的那一項資訊。點一下就複製，不另加按鈕 */
  .src {
    grid-column: 2;
    grid-row: 2;
    align-self: start;
    justify-self: start;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl; /* 網址尾巴比開頭有資訊，截開頭不截尾 */
    text-align: left;
    font-size: 11.5px;
    color: var(--dim);
    cursor: pointer;
  }
  .src:hover { color: var(--ink); text-decoration: underline; }
  .src.copied { color: var(--pass); }
  .stat {
    grid-column: 3;
    grid-row: 1;
    align-self: center;
    font-size: 12px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .track[data-status="done"]   .stat { color: var(--pass); }
  .track[data-status="failed"] .stat { color: var(--fail); }

  /* 抓下來就該能播，所以完成的項目點一下直接用系統播放器開啟 */
  .track[data-status="done"] { cursor: pointer; }
  .track[data-status="done"]:hover { background: #20262c; }

  /* 分段式電平表 —— 這支工具的招牌，用 repeating gradient 畫成 LED 階梯，
     純 CSS 沒有 per-frame 計算 */
  .meter {
    grid-column: 2 / -1;
    grid-row: 3;
    height: 5px;
    background: var(--sunk);
    border-radius: 1px;
    overflow: hidden;
  }

  .meter > i {
    display: block;
    width: 0;
    height: 100%;
    background: repeating-linear-gradient(90deg,
      var(--lamp) 0 3px, transparent 3px 5px);
    transition: width 0.18s linear;
  }

  /* 驗證中：滿格但調暗，表示資料到手、正在檢查 */
  .track[data-status="verifying"] .meter > i { opacity: 0.45; }

  .track[data-status="done"] .meter,
  .track[data-status="failed"] .meter,
  .track[data-status="queued"] .meter,
  .track[data-status="resolving"] .meter { display: none; }

  .why {
    grid-column: 2 / -1;
    grid-row: 4;
    font-size: 11.5px;
    color: var(--fail);
    -webkit-user-select: text;
    user-select: text;
  }

  /* 失敗後的出路：重試、用瀏覽器抓、改用錄製。安靜的行內按鈕，不彈視窗、不自動接手 */
  .acts {
    grid-column: 2 / -1;
    grid-row: 5;
    display: flex;
    gap: 6px;
  }
  .act {
    margin-top: 4px;
    padding: 3px 9px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1.4 var(--sans);
    cursor: pointer;
  }
  .act:hover { color: var(--ink); background: #2b3138; }
  /* 瀏覽器偵測不到時，錄製是唯一出路，讓它明顯一點 */
  .act.primary { color: var(--lamp); border-color: #4a3a18; }

  /* 瀏覽器偵測到的候選。自動挑的那個標出來，其餘可以另外抓 */
  .cands {
    grid-column: 2 / -1;
    grid-row: 6;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .cand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .cand .url {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl; /* 網址尾巴比開頭有資訊，截開頭不截尾 */
    text-align: left;
    flex: 1;
  }
  .cand .pick {
    padding: 1px 7px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: transparent;
    color: var(--dim);
    font: 11px/1.4 var(--sans);
    cursor: pointer;
  }
  .cand .pick:hover { color: var(--ink); }
  .cand.on { color: var(--lamp); }

  .track[data-status="browser"] .meter > i { width: 100%; opacity: 0.25; }

  /* 想搬、想刪、想改名：一步跳到真正的檔案管理器，Haul 自己不做這些 */
  .show {
    grid-column: 3;
    grid-row: 2;
    justify-self: end;
    visibility: hidden;
    padding: 2px 8px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: transparent;
    color: var(--dim);
    font: 11px/1.4 var(--sans);
  }
  .track[data-status="done"]:not([data-missing]):hover .show { visibility: visible; }
  .show:hover { color: var(--ink); }

  /* 移除。試過用滑的，手勢跟捲動打架，收掉只留這顆 */
  .x {
    grid-column: 4;
    grid-row: 1;
    align-self: center;
    visibility: hidden;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--dim);
    font: 14px/20px var(--sans);
    text-align: center;
  }
  .track:hover .x { visibility: visible; }
  .x:hover { background: #2b3138; color: var(--ink); }

  /* 還沒完成就要移除：先問。列內確認，不彈視窗 */
  .confirm {
    grid-column: 2 / -1;
    grid-row: 7;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--lamp);
  }
  .confirm[hidden] { display: none; }
  .confirm button { padding: 2px 9px; font-size: 11.5px; }

  /* ---------------------------------------------------------- 狀態列 */

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 10px;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
  }

  #dest {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    -webkit-user-select: text;
    user-select: text;
  }

  #tally {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #tally:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------------------------------------------------------- 設定面板 */

  dialog#settings {
    width: min(520px, 92vw);
    max-height: 88vh;
    padding: 0;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
  }
  dialog#settings::backdrop { background: rgba(0, 0, 0, 0.5); }

  .sheet {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 20px 16px;
    overflow-y: auto;
  }
  .sheet h2 { margin: 0; font-size: 15px; font-weight: 600; }

  .sheet fieldset {
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0;
  }
  .sheet legend { padding: 0 6px; color: var(--dim); font-size: 12px; }

  .sheet label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .sheet label.check { gap: 8px; }
  .sheet label.pathrow, .sheet .pathrow { flex-wrap: wrap; }

  .sheet .path {
    flex: 1;
    min-width: 120px;
    color: var(--dim);
    font: 12px var(--mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }
  .sheet .note { color: var(--dim); font-size: 11.5px; }

  .sheet select, .sheet input[type="number"] {
    padding: 4px 6px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--sunk);
    color: var(--ink);
    font: 500 12px/1 var(--sans);
  }
  .sheet input[type="number"] { width: 64px; }

  .sheet button {
    padding: 4px 10px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1.4 var(--sans);
    cursor: pointer;
  }
  .sheet button:hover { color: var(--ink); background: #2b3138; }
  .sheet button.primary { background: var(--lamp); color: #1a1200; border-color: var(--lamp); }

  .sheet-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>

<section class="intake">
  <div class="field" id="field">
    <textarea id="input" spellcheck="false" data-i18n-placeholder="input.placeholder"
      placeholder="貼上影片、音樂或圖片的連結，一行一個"></textarea>
    <div class="row-actions">
      <div class="modes" role="radiogroup" data-i18n-aria-label="modes.label" aria-label="要下載什麼">
        <button type="button" class="mode on" data-mode="video" role="radio" aria-checked="true" data-i18n="mode.video">影片</button>
        <button type="button" class="mode" data-mode="audio" role="radio" aria-checked="false" data-i18n="mode.audio">只要聲音</button>
        <button type="button" class="mode" data-mode="image" role="radio" aria-checked="false" data-i18n="mode.image"
          data-i18n-title="mode.image.title" title="影片連結抓封面圖；圖片網址直接抓；圖庫頁需要 gallery-dl">圖片</button>
      </div>
      <button class="primary" id="go" data-i18n="go">加入佇列</button>
    </div>
  </div>
  <p class="hint" id="hint" data-i18n="hint.default">單支或整份清單都可以</p>
</section>

<div id="setup" hidden>
  <span id="setup-text" data-i18n="setup.preparing">正在準備下載工具…</span>
  <div class="meter"><i id="setup-fill"></i></div>
</div>

<div id="update-bar" hidden>
  <span id="update-text"></span>
  <button type="button" id="update-go" class="primary" data-i18n="update.go">更新並重新啟動</button>
</div>

<nav class="tabs" role="tablist">
  <button type="button" class="tab on" data-tab="active" role="tab" aria-selected="true"><span data-i18n="tab.active">佇列</span> <b id="n-active">0</b></button>
  <button type="button" class="tab" data-tab="done" role="tab" aria-selected="false"><span data-i18n="tab.done">已完成</span> <b id="n-done">0</b></button>
</nav>

<div id="queue">
  <p class="empty" id="empty">佇列是空的。貼上連結就會開始下載。</p>
  <div id="active"></div>
  <div id="done" hidden></div>
</div>

<footer>
  <span id="dest">—</span>
  <span id="tally"></span>
  <button id="gear" data-i18n-title="settings.title" title="設定">⚙</button>
  <button id="reveal" data-i18n="footer.openFolder">開啟資料夾</button>
  <button id="clear" data-i18n="footer.clearDone">清掉已完成</button>
</footer>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2 data-i18n="settings.title">設定</h2>

    <fieldset>
      <legend data-i18n="set.ui">介面</legend>
      <label><span data-i18n="set.language">語言</span>
        <select id="set-lang">
          <option value="" data-i18n="lang.system">跟隨系統</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.download">下載</legend>
      <label class="pathrow"><span data-i18n="set.outDir">輸出資料夾</span>
        <span id="set-out" class="path">預設</span>
        <button type="button" id="set-out-pick" data-i18n="set.choose">選擇…</button>
        <span class="note" data-i18n="set.restart">重新啟動後生效</span>
      </label>
      <label><span data-i18n="set.quality">畫質上限</span>
        <select id="set-quality">
          <option value="" data-i18n="set.noLimit">不設限</option>
          <option value="2160">2160p</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
        </select>
      </label>
      <label><span data-i18n="set.concurrency">同時下載數</span>
        <input type="number" id="set-concurrency" min="1" max="8">
        <span class="note" data-i18n="set.restart">重新啟動後生效</span>
      </label>
      <label class="check"><input type="checkbox" id="set-chime-on"> <span data-i18n="set.chime">佇列完成時播放提示音</span></label>
      <div class="pathrow" id="chime-file-row">
        <span id="set-chime-file" class="path">內建提示音</span>
        <button type="button" id="chime-pick" data-i18n="set.chooseFile">選檔…</button>
        <button type="button" id="chime-clear" data-i18n="set.chimeBuiltinBtn">改回內建</button>
        <button type="button" id="chime-test" data-i18n="set.chimeTest">試聽</button>
      </div>
    </fieldset>

    <fieldset>
      <legend data-i18n="set.login">登入</legend>
      <label><span data-i18n="set.cookies">登入狀態來源</span>
        <select id="set-cookies">

      <legend data-i18n="set.browser">瀏覽器 / 錄製</legend>

    <div class="sheet-actions">
      <button type="button" id="set-cancel" data-i18n="set.cancel">取消</button>
      <button type="button" id="set-save" class="primary" data-i18n="set.save">儲存</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const { invoke } = window.__TAURI__.core;
  const { listen }  = window.__TAURI__.event;

  // ---------------------------------------------------------- 語言
  // 介面字串兩份字典。引擎回報的錯誤訊息不翻——那是診斷用的，跟紀錄檔一致。

    'zh-TW': {

      'row.missing': '檔案已不在', 'row.play': '點一下播放',
      'row.stop': '停止', 'row.record': '改用錄製', 'row.recordAudio': '改用錄製（只要聲音）',
      'reveal.finder': '在 Finder 顯示', 'reveal.explorer': '在檔案總管顯示',
      'tally.running': '{n} 進行中', 'tally.done': '{n} 完成', 'tally.failed': '{n} 失敗',
      'cand.manifest': '串流清單', 'cand.file': '單檔', 'cand.chosen': '已選', 'cand.pick': '抓這個',
      'set.ui': '介面', 'set.language': '語言', 'lang.system': '跟隨系統',
      'set.download': '下載', 'set.outDir': '輸出資料夾', 'set.outDefault': '預設（~/Downloads/Haul）',
      'set.choose': '選擇…', 'set.restart': '重新啟動後生效', 'set.quality': '畫質上限', 'set.noLimit': '不設限',
      'set.concurrency': '同時下載數', 'set.chime': '佇列完成時播放提示音', 'set.chimeBuiltin': '內建提示音',
      'set.chooseFile': '選檔…', 'set.chimeBuiltinBtn': '改回內建', 'set.chimeTest': '試聽',
      'set.login': '登入', 'set.cookies': '登入狀態來源', 'set.noLogin': '不用登入',
      'set.cookiesNote': 'Haul 不碰帳密，只借用瀏覽器已有的登入狀態。',
      'set.browser': '瀏覽器 / 錄製', 'set.browserPath': '瀏覽器路徑', 'set.autoDetect': '自動偵測', 'set.auto': '自動',
      'set.recordMax': '錄製上限（分鐘）', 'set.tools': '工具',
      'set.updateYtdlp': '更新 yt-dlp', 'set.updateYtdlp.title': '各站改版時靠這個跟上',
      'set.updateApp': '檢查 Haul 更新', 'set.updateApp.title': '從 GitHub Releases 取得新版',
      'set.cancel': '取消', 'set.save': '儲存', 'set.saveFailed': '存不了設定：',
    },
    'en': {
      'input.placeholder': 'Paste video, music or image links, one per line',
      'modes.label': 'What to download',
      'mode.video': 'Video', 'mode.audio': 'Audio only', 'mode.image': 'Images',
      'mode.image.title': 'Cover art for video links; direct image URLs; every image on an ordinary page',
      'go': 'Add to queue',
      'hint.default': 'A single link or a whole playlist',
      'setup.preparing': 'Preparing download tools…',
      'setup.failed': 'Preparing tools failed: ', 'setup.unknown': 'unknown reason',
      'setup.fetching': 'First launch, fetching {tool}{size}',
      'update.go': 'Update and restart',
      'update.available': 'Version v{v} is available', 'update.latest': 'Haul is up to date',
      'update.checkFailed': 'Update check failed: ', 'update.downloading': 'Downloading update…',
      'update.progress': 'Downloading update {a}', 'update.progressOf': 'Downloading update {a} / {b}',
      'update.failed': 'Update failed: ',
      'ytdlp.updating': 'Updating yt-dlp…', 'ytdlp.latest': 'yt-dlp is up to date',
      'tab.active': 'Queue', 'tab.done': 'Done',
      'empty.active': 'The queue is empty. Paste a link to start.', 'empty.done': 'Nothing finished yet.',
      'settings.title': 'Settings', 'footer.openFolder': 'Open folder', 'footer.clearDone': 'Clear done',
      'status.queued': 'Queued', 'status.resolving': 'Resolving',
      'status.browser': 'Browser sniffing · press play in the window if the page needs it',
      'status.recording': 'Recording · play the content in the browser window',
      'status.downloading': 'Downloading', 'status.verifying': 'Verifying',
      'stat.detected': '{n} media found', 'stat.verified': 'Verified', 'stat.verifiedRec': 'Verified · recorded',
      'stat.failed': 'Failed',
      'row.copySrc': 'Click to copy the link', 'row.copied': 'Copied', 'row.copyFailed': 'Copy failed',
      'row.remove': 'Remove from list', 'row.retry': 'Retry', 'row.browser': 'Use browser',
      'row.confirmYes': 'Remove', 'row.confirmNo': 'Cancel',
      'row.confirmRecording': 'Still recording — removing stops it and discards what was captured.',
      'row.confirmActive': 'Not finished yet — removing cancels this download.',
      'row.missing': 'File is gone', 'row.play': 'Click to play',
      'row.stop': 'Stop', 'row.record': 'Record instead', 'row.recordAudio': 'Record instead (audio only)',
      'reveal.finder': 'Show in Finder', 'reveal.explorer': 'Show in Explorer',
      'tally.running': '{n} running', 'tally.done': '{n} done', 'tally.failed': '{n} failed',
      'cand.manifest': 'stream manifest', 'cand.file': 'file', 'cand.chosen': 'chosen', 'cand.pick': 'Get this',
      'set.ui': 'Interface', 'set.language': 'Language', 'lang.system': 'System',
      'set.download': 'Download', 'set.outDir': 'Output folder', 'set.outDefault': 'Default (~/Downloads/Haul)',
      'set.choose': 'Choose…', 'set.restart': 'Takes effect after restart', 'set.quality': 'Quality cap', 'set.noLimit': 'No limit',
      'set.concurrency': 'Concurrent downloads', 'set.chime': 'Play a chime when the queue finishes', 'set.chimeBuiltin': 'Built-in chime',
      'set.chooseFile': 'Choose file…', 'set.chimeBuiltinBtn': 'Use built-in', 'set.chimeTest': 'Preview',
      'set.login': 'Login', 'set.cookies': 'Login source', 'set.noLogin': 'No login',
      'set.cookiesNote': 'Haul never touches passwords; it only borrows the browser\'s existing login.',
      'set.browser': 'Browser / Recording', 'set.browserPath': 'Browser path', 'set.autoDetect': 'Auto-detect', 'set.auto': 'Auto',
      'set.recordMax': 'Recording limit (minutes)', 'set.tools': 'Tools',
      'set.updateYtdlp': 'Update yt-dlp', 'set.updateYtdlp.title': 'Keep up when sites change',
      'set.updateApp': 'Check for Haul updates', 'set.updateApp.title': 'Fetch a new version from GitHub Releases',
      'set.cancel': 'Cancel', 'set.save': 'Save', 'set.saveFailed': 'Could not save settings: ',
    },
  };
  let lang = 'zh-TW';
  const t = (key, vars) => {
    let s = (I18N[lang] && I18N[lang][key]) || I18N['zh-TW'][key] || key;
    if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
  };
  function systemLang() {
    return String(navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-TW' : 'en';
  }
  /* 把靜態標記與動態列全部重畫。切換語言不用重開 */
  function applyLang(next) {
    lang = I18N[next] ? next : systemLang();
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
    for (const el of document.querySelectorAll('[data-i18n-aria-label]')) el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
    // 下面這些在啟動流程走到這裡時都已宣告；hint 的預設字由 data-i18n 一起換掉
    for (const row of rows.values()) if (row.item) paint(row.item);
    updateTabs();
    updateTally();
  }

  const queue = document.getElementById('queue');
  const empty = document.getElementById('empty');
  const activeBox = document.getElementById('active');
  const doneBox   = document.getElementById('done');
  const nActive   = document.getElementById('n-active');
  const nDone     = document.getElementById('n-done');
  const revealLabel = () => t(/Win/.test(navigator.platform) ? 'reveal.explorer' : 'reveal.finder');
  const input = document.getElementById('input');
  const field = document.getElementById('field');
  const go    = document.getElementById('go');
  const tally = document.getElementById('tally');

  /** id -> { item, el, refs }，只改動到的那一列，不重繪整張表 */
  const rows = new Map();

  const label = status => t('status.' + status);

  const mb = n => (n / 1048576).toFixed(1) + ' MB';

  const clock = s => {
    const t = Math.round(s);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  };

  function statLine(it) {
    switch (it.status) {
      case 'downloading':
        return it.total
          ? `${mb(it.bytes)} / ${mb(it.total)}`
          : mb(it.bytes);
      case 'browser':
        return it.total ? t('stat.detected', { n: it.total }) : label('browser');
      case 'recording':
        return it.bytes ? `● ${clock(it.secs || 0)} · ${mb(it.bytes)}` : label('recording');
      case 'done': {
        const tag = t(it.source === 'recording' ? 'stat.verifiedRec' : 'stat.verified');
        return it.secs ? `${tag} · ${clock(it.secs)}` : tag;
      }
      case 'failed':
        return t('stat.failed');
      default:
        return I18N[lang]['status.' + it.status] ? label(it.status) : it.status;
    }
  }

  function makeRow(it) {
    const el = document.createElement('div');
    el.className = 'track';
    el.innerHTML =
      '<span class="thumb"><img alt=""></span>' +
      '<span class="name"></span>' +
      '<span class="src"></span>' +
      '<span class="stat"></span>' +
      '<div class="meter"><i></i></div>' +
      '<button type="button" class="x">×</button>' +
      '<button type="button" class="show"></button>' +
      '<span class="why"></span>' +
      '<div class="acts">' +
        '<button type="button" class="act retry" hidden></button>' +
        '<button type="button" class="act" hidden></button>' +
        '<button type="button" class="act act2" hidden></button>' +
      '</div>' +
      '<div class="cands" hidden></div>' +
      '<div class="confirm" hidden><span></span>' +
        '<button type="button" class="yes primary"></button>' +
        '<button type="button" class="no"></button></div>';
    const refs = {
      thumb: el.querySelector('.thumb'),
      img:   el.querySelector('.thumb img'),
      show:  el.querySelector('.show'),
      x:     el.querySelector('.x'),
      src:   el.querySelector('.src'),
      confirm: el.querySelector('.confirm'),
      confirmText: el.querySelector('.confirm > span'),
      yes:   el.querySelector('.confirm .yes'),
      no:    el.querySelector('.confirm .no'),
      name:  el.querySelector('.name'),
      stat:  el.querySelector('.stat'),
      fill:  el.querySelector('.meter > i'),
      why:   el.querySelector('.why'),
      retry: el.querySelector('.retry'),
      act:   el.querySelector('.act:not(.act2):not(.retry)'),
      act2:  el.querySelector('.act2'),
      cands: el.querySelector('.cands'),
    };
    refs.act.addEventListener('click', ev => {
      ev.stopPropagation();
      refs.act.disabled = true;
      invoke('retry_with_browser', { id: it.id }).catch(err => say(String(err), true));
    });
    refs.retry.addEventListener('click', ev => {
      ev.stopPropagation();
      refs.retry.disabled = true;
      invoke('retry_item', { id: it.id, quality: settings.maxHeight ?? null })
        .catch(err => { refs.retry.disabled = false; say(String(err), true); });
    });
    // act2 身兼「改用錄製」與「停止」，依當下狀態決定送哪個指令
    refs.act2.addEventListener('click', ev => {
      ev.stopPropagation();
      const cmd = el.dataset.status === 'recording' ? 'stop_recording' : 'record_item';
      refs.act2.disabled = true;
      invoke(cmd, { id: it.id }).catch(err => say(String(err), true));
    });
    refs.show.addEventListener('click', ev => {
      ev.stopPropagation();
      if (el.dataset.path) invoke('reveal_file', { path: el.dataset.path }).catch(err => say(String(err), true));
    });
    refs.x.addEventListener('click', ev => { ev.stopPropagation(); askRemove(it.id, el, refs); });
    refs.src.addEventListener('click', async ev => {
      ev.stopPropagation();
      const url = refs.src.dataset.url;
      if (await copyText(url)) {
        refs.src.classList.add('copied');
        refs.src.textContent = t('row.copied');
        setTimeout(() => { refs.src.textContent = url + '\u200E'; refs.src.classList.remove('copied'); }, 900);
      } else {
        say(t('row.copyFailed'), true);
      }
    });
    refs.yes.addEventListener('click', ev => { ev.stopPropagation(); doRemove(it.id, el); });
    refs.no.addEventListener('click', ev => { ev.stopPropagation(); refs.confirm.hidden = true; });
    return { el, refs };
  }

  const TERMINAL = new Set(['done', 'failed']);

  /* 移除：完成或失敗的直接拿掉；還沒完成的先在列內問一次，因為那等於取消下載 */
  function askRemove(id, el, refs) {
    if (TERMINAL.has(el.dataset.status)) return doRemove(id, el);
    refs.confirmText.textContent = t(el.dataset.status === 'recording' ? 'row.confirmRecording' : 'row.confirmActive');
    refs.confirm.hidden = false;
  }

  function doRemove(id, el) {
    el.classList.add('gone');
    invoke('remove_item', { id })
      .then(() => dropRow(id))
      .catch(err => { el.classList.remove('gone'); say(String(err), true); });
  }

  function dropRow(id) {
    const row = rows.get(id);
    if (!row) return;
    row.el.remove();
    rows.delete(id);
    thumbAsked.delete(id);
    updateTabs();
    updateTally();
  }

  // ---------------------------------------------------------- 分頁

  let tab = 'active';
  function showTab(name) {
    tab = name;
    for (const b of document.querySelectorAll('.tab')) {
      const on = b.dataset.tab === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', String(on));
    }
    activeBox.hidden = name !== 'active';
    doneBox.hidden = name !== 'done';
    updateTabs();
  }
  function updateTabs() {
    nActive.textContent = activeBox.childElementCount;
    nDone.textContent = doneBox.childElementCount;
    const box = tab === 'done' ? doneBox : activeBox;
    empty.textContent = t('empty.' + tab);
    empty.hidden = box.childElementCount > 0;
  }
  for (const b of document.querySelectorAll('.tab')) {
    b.addEventListener('click', () => showTab(b.dataset.tab));
  }

  /* 依狀態放到對的分頁：佇列依加入順序，已完成新的在上 */
  function place(el, status) {
    const box = status === 'done' ? doneBox : activeBox;
    if (el.parentNode !== box) {
      if (status === 'done') box.prepend(el); else box.appendChild(el);
    }
    updateTabs();
  }

  /* 每個項目只問一次縮圖。舊項目（更新前下載的）由後端從原檔補產 */
  const thumbAsked = new Set();
  function loadThumb(it, el, refs) {
    if (thumbAsked.has(it.id)) return;
    thumbAsked.add(it.id);
    invoke('thumb', { id: it.id }).then(b64 => {
      if (!b64) return;
      refs.img.src = 'data:image/jpeg;base64,' + b64;
      refs.thumb.classList.add('has');
    }).catch(() => {
      // 原檔已不在（或讀不到）：留著紀錄但不再假裝點得開
      el.dataset.missing = '1';
      el.title = t('row.missing');
    });
  }

  function paint(it) {
    if (it.status === 'removed') return dropRow(it.id);
    let row = rows.get(it.id);
    if (!row) {
      row = makeRow(it);
      rows.set(it.id, row);
    }
    const { el, refs } = row;
    row.item = it; // 切換語言時要能整列重畫

    // 依當下語言的固定文字
    refs.src.title = t('row.copySrc');
    refs.x.title = t('row.remove');
    refs.retry.textContent = t('row.retry');
    refs.act.textContent = t('row.browser');
    refs.yes.textContent = t('row.confirmYes');
    refs.no.textContent = t('row.confirmNo');
    refs.show.textContent = revealLabel();

    el.dataset.status = it.status;
    place(el, it.status);
    // 狀態變了就把「還沒完成要不要移除」的問句收掉——答案可能已經過期
    if (TERMINAL.has(it.status)) refs.confirm.hidden = true;
    refs.thumb.dataset.kind = it.kind;
    if (it.status === 'done') loadThumb(it, el, refs);
    refs.name.textContent = it.title || it.input;
    refs.name.title = it.title || it.input;
    if (refs.src.dataset.url !== it.input) {
      refs.src.dataset.url = it.input;
      // direction: rtl 會把結尾的 / 之類中性字元甩到最前面，補一個 LRM 壓住
      refs.src.textContent = it.input + '\u200E';
    }
    refs.stat.textContent = statLine(it);

    if (it.status === 'downloading' && it.total > 0) {
      refs.fill.style.width = Math.min(100, (it.bytes / it.total) * 100) + '%';
    } else if (it.status === 'verifying') {
      refs.fill.style.width = '100%';
    }

    if (it.path) el.dataset.path = it.path;
    if (el.dataset.missing) el.title = t('row.missing');
    else el.title = it.status === 'done' && it.path ? t('row.play') : '';

    refs.why.textContent = it.status === 'failed' ? (it.error || '') : '';
    refs.why.hidden = it.status !== 'failed';

    // 失敗的都能重試；只有萃取類的失敗才給瀏覽器那顆，401 / 429 / 驗證失敗開瀏覽器也救不了
    refs.retry.hidden = it.status !== 'failed';
    refs.retry.disabled = false;
    refs.act.hidden = !(it.status === 'failed' && it.canBrowser);
    refs.act.disabled = false;
    // act2：錄製中→停止；可改用錄製的失敗→改用錄製（瀏覽器也救不了時是唯一出路）
    if (it.status === 'recording') {
      refs.act2.hidden = false;
      refs.act2.disabled = false;
      refs.act2.textContent = t('row.stop');
      refs.act2.classList.remove('primary');
    } else if (it.status === 'failed' && it.canRecord) {
      refs.act2.hidden = false;
      refs.act2.disabled = false;
      refs.act2.textContent = t(it.kind === 'audio' ? 'row.recordAudio' : 'row.record');
      refs.act2.classList.toggle('primary', !it.canBrowser);
    } else {
      refs.act2.hidden = true;
    }
    if (it.status !== 'browser' && it.status !== 'downloading' &&
        it.status !== 'verifying' && it.status !== 'done') {
      refs.cands.hidden = true;
    }

    updateTally();
  }

  function updateTally() {
    let running = 0, done = 0, failed = 0;
    for (const { el } of rows.values()) {
      const s = el.dataset.status;
      if (s === 'done') done++;
      else if (s === 'failed') failed++;
      else running++;
    }
    const parts = [];
    if (running) parts.push(t('tally.running', { n: running }));
    if (done)    parts.push(t('tally.done', { n: done }));
    if (failed)  parts.push(t('tally.failed', { n: failed }));
    tally.textContent = parts.join(' · ');

    // 進行中的數量從 >0 掉到 0：佇列清空了，響一次。
    // prevRunning 一開始是 null，載入 snapshot 那次不會誤響。
    if (prevRunning !== null && prevRunning > 0 && running === 0) playChime();
    prevRunning = running;
  }
  let prevRunning = null;

  function reset(items) {
    rows.clear();
    thumbAsked.clear();
    activeBox.replaceChildren();
    doneBox.replaceChildren();
    items.forEach(paint);
    updateTabs();
    updateTally();
  }

  const hint = document.getElementById('hint');
  const HINT_DEFAULT = () => t('hint.default');
  let mode = 'video';

  for (const b of document.querySelectorAll('.mode')) {
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      for (const other of document.querySelectorAll('.mode')) {
        const on = other === b;
        other.classList.toggle('on', on);
        other.setAttribute('aria-checked', String(on));
      }
    });
  }

  function say(msg, bad) {
    hint.textContent = msg;
    hint.classList.toggle('bad', !!bad);
    if (msg !== HINT_DEFAULT()) {
      clearTimeout(say.t);
      say.t = setTimeout(() => say(HINT_DEFAULT(), false), 5000);
    }
  }

  // 剪貼簿：WebKit 在使用者手勢裡允許 navigator.clipboard；不行就退回舊招
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (_) { return false; }
  }

  async function submit() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    go.disabled = true;
    try {
      // 登入來源與預設畫質從設定面板帶，不再是輸入欄旁的下拉
      await invoke('add', {
        text,
        mode,
        cookies: settings.cookiesFrom || null,
        quality: settings.maxHeight ?? null,
      });
      input.value = '';
      showTab('active');
    } catch (e) {
      // 後端把「看不懂輸入」當成錯誤回來，顯示在提示位置
      say(String(e), true);
    } finally {
      go.disabled = false;
      input.focus();
    }
  }

  go.addEventListener('click', submit);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  });

  // 拖網址進視窗
  ['dragenter', 'dragover'].forEach(t =>
    field.addEventListener(t, e => { e.preventDefault(); field.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(t =>
    field.addEventListener(t, () => field.classList.remove('dropping')));
  field.addEventListener('drop', e => {
    e.preventDefault();
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (!text) return;
    input.value = input.value ? input.value + '\n' + text : text;
    submit();
  });

  document.getElementById('reveal').addEventListener('click', () => invoke('open_out_dir'));
  document.getElementById('clear').addEventListener('click', async () => {
    reset(await invoke('clear_done'));
  });

  // 完成的項目點一下就播放。用委派監聽，佇列再長也只有一個 listener。
  queue.addEventListener('click', e => {
    const row = e.target.closest('.track');
    if (!row || row.dataset.status !== 'done' || !row.dataset.path || row.dataset.missing) return;
    invoke('open_file', { path: row.dataset.path })
      .catch(err => say(String(err), true));
  });

  // 首次啟動要抓 yt-dlp 與 ffmpeg（約 80MB），把進度顯示出來，
  // 不然使用者只會看到一個沒反應的視窗
  const setup = document.getElementById('setup');
  const setupText = document.getElementById('setup-text');
  const setupFill = document.getElementById('setup-fill');

  // 已經動用到 yt-dlp / ffmpeg 的狀態。resolving 不算 —— 那時工具可能還在下載。
  const NEEDS_TOOLS = new Set(['browser', 'recording', 'downloading', 'verifying', 'done']);

  listen('item', e => {
    paint(e.payload);
    // 走到這些狀態就代表工具已經就緒。單靠 done 事件的話，只要那則事件
    // 沒送到（例如被進度事件淹沒），進度列就會永遠留在畫面上。
    if (NEEDS_TOOLS.has(e.payload.status)) setup.hidden = true;
  });

  const kb = n => n == null ? '' : (n >= 1048576 ? mb(n) : (n / 1024).toFixed(0) + ' KB');

  // 瀏覽器偵測到的候選：自動挑的標「已選」，其餘給「抓這個」——
  // 那會新增一個項目，不會取消正在跑的
  listen('candidates', e => {
    const { id, candidates, chosen } = e.payload;
    const row = rows.get(id);
    if (!row) return;
    const box = row.refs.cands;
    box.textContent = '';
    candidates.forEach((c, i) => {
      const line = document.createElement('div');
      line.className = 'cand' + (i === chosen ? ' on' : '');
      const kind = t(c.kind === 'manifest' ? 'cand.manifest' : 'cand.file');
      line.innerHTML =
        `<span>${i === chosen ? t('cand.chosen') : '　　'}</span>` +
        `<span>${kind}</span>` +
        `<span>${kb(c.size)}</span>` +
        `<span class="url"></span>` +
        (i === chosen ? '' : `<button type="button" class="pick">${t('cand.pick')}</button>`);
      line.querySelector('.url').textContent = c.url;
      line.querySelector('.url').title = c.url;
      const pick = line.querySelector('.pick');
      if (pick) pick.addEventListener('click', ev => {
        ev.stopPropagation();
        pick.disabled = true;
        invoke('add_candidate', { id, candidate: c }).catch(err => say(String(err), true));
      });
      box.appendChild(line);
    });
    box.hidden = candidates.length === 0;
  });

  listen('setup', e => {
    const s = e.payload;
    if (s.stage === 'done') { setup.hidden = true; return; }
    setup.hidden = false;
    if (s.stage === 'failed') {
      setupText.textContent = t('setup.failed') + (s.error || t('setup.unknown'));
      setupFill.style.width = '0';
      return;
    }
    const mbTotal = s.total ? ` ${mb(s.bytes)} / ${mb(s.total)}` : '';
    setupText.textContent = t('setup.fetching', { tool: s.tool, size: mbTotal });
    setupFill.style.width = s.total ? (s.bytes / s.total) * 100 + '%' : '0';
  });

  document.getElementById('update').addEventListener('click', async (ev) => {
    ev.target.disabled = true;
    say(t('ytdlp.updating'), false);
    try {
      const out = await invoke('update_tools');
      say(out || t('ytdlp.latest'), false);
    } catch (e) {
      say(t('update.failed') + String(e), true);
    } finally {
      ev.target.disabled = false;
    }
  });

  // ---------------------------------------------------------- 設定面板

  // add 送出時要用的設定，App 啟動與每次存檔後同步
  let settings = {};

  let audioCtx;
  function ctx() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  // 內建提示音：兩個短音，純合成，不需資源
  function beep() {
    try {
      const c = ctx(), now = c.currentTime;
      [880, 1320].forEach((f, i) => {
        const o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; o.connect(g); g.connect(c.destination);
        const t = now + i * 0.12;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        o.start(t); o.stop(t + 0.12);
      });
    } catch (_) {}
  }
  async function playFile(path) {
    // 後端讀位元組回 base64，前端解碼播放，不必開 asset protocol 白名單
    const b64 = await invoke('read_audio', { path });
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const buf = await ctx().decodeAudioData(bytes.buffer);
    const src = ctx().createBufferSource();
    src.buffer = buf; src.connect(ctx().destination); src.start();
  }
  async function playChime() {
    if (!settings.chime || !settings.chime.enabled) return;
    if (!settings.chime.file) return beep();
    try { await playFile(settings.chime.file); }
    catch (_) { beep(); } // 檔案不見或解不動就退回內建
  }

  const dlg = document.getElementById('settings');
  const $ = id => document.getElementById(id);
  // 面板上暫存的路徑（按儲存才寫回）
  let draftChimeFile = null, draftBrowserPath = null, draftOutDir = null;

  function showPath(el, val, fallback) {
    el.textContent = val || fallback;
    el.title = val || fallback;
  }

  function fillPanel(s) {
    $('set-quality').value = s.maxHeight != null ? String(s.maxHeight) : '';
    $('set-concurrency').value = s.concurrency;
    $('set-cookies').value = s.cookiesFrom || '';
    $('set-record-max').value = Math.round((s.recordMaxSecs || 10800) / 60);
    $('set-chime-on').checked = !!(s.chime && s.chime.enabled);
    draftChimeFile = (s.chime && s.chime.file) || null;
    draftBrowserPath = s.browserPath || null;
    draftOutDir = s.outDir || null;
    $('set-lang').value = s.language || '';
    showPath($('set-out'), s.outDir, t('set.outDefault'));
    showPath($('set-chime-file'), draftChimeFile, t('set.chimeBuiltin'));
    showPath($('set-browser'), draftBrowserPath, t('set.autoDetect'));
  }

  $('gear').addEventListener('click', async () => {
    fillPanel(await invoke('get_settings'));
    dlg.showModal();
  });
  $('set-cancel').addEventListener('click', () => dlg.close());

  $('set-out-pick').addEventListener('click', async () => {
    const path = await invoke('pick_folder');
    if (path) { draftOutDir = path; showPath($('set-out'), path, t('set.outDefault')); }
  });

  $('chime-pick').addEventListener('click', async () => {
    const path = await invoke('pick_audio_file');
    if (!path) return;
    try {
      await invoke('verify_audio', { path });
      draftChimeFile = path;
      showPath($('set-chime-file'), path, t('set.chimeBuiltin'));
      $('set-chime-on').checked = true;
    } catch (e) { say(String(e), true); }
  });
  $('chime-clear').addEventListener('click', () => {
    draftChimeFile = null;
    showPath($('set-chime-file'), null, t('set.chimeBuiltin'));
  });
  $('chime-test').addEventListener('click', async () => {
    if (draftChimeFile) { try { await playFile(draftChimeFile); return; } catch (_) {} }
    beep();
  });

  $('browser-pick').addEventListener('click', async () => {
    const path = await invoke('pick_audio_file'); // 同一個原生選檔器，選任意檔
    if (path) { draftBrowserPath = path; showPath($('set-browser'), path, t('set.autoDetect')); }
  });
  $('browser-clear').addEventListener('click', () => {
    draftBrowserPath = null;
    showPath($('set-browser'), null, t('set.autoDetect'));
  });

  $('set-save').addEventListener('click', async () => {
    const q = $('set-quality').value;
    const next = {
      outDir: draftOutDir,                       // 改了要重啟才生效（見面板上的註記）
      maxHeight: q ? Number(q) : null,
      concurrency: Math.max(1, Math.min(8, Number($('set-concurrency').value) || 3)),
      cookiesFrom: $('set-cookies').value || null,
      browserPath: draftBrowserPath,
      recordMaxSecs: Math.max(1, Number($('set-record-max').value) || 180) * 60,
      chime: { enabled: $('set-chime-on').checked, file: draftChimeFile },
      language: $('set-lang').value || null,
    };
    try {
      await invoke('save_settings', { settings: next });
      settings = next;
      dlg.close();
      applyLang(next.language || systemLang());
    } catch (e) { say(t('set.saveFailed') + String(e), true); }
  });

  // ---------------------------------------------------------- 自我更新

  const updateBar = $('update-bar'), updateText = $('update-text'), updateGo = $('update-go');

  // 啟動時靜靜查一次；設定面板手動按的才把「沒有新版／失敗」講出來
  async function checkUpdate(manual) {
    try {
      const u = await invoke('check_update');
      if (u) {
        updateText.textContent = t('update.available', { v: u.version });
        updateBar.hidden = false;
        if (manual) dlg.close();
      } else if (manual) {
        say(t('update.latest'), false);
      }
    } catch (e) {
      if (manual) say(t('update.checkFailed') + String(e), true);
    }
  }
  updateGo.addEventListener('click', async () => {
    updateGo.disabled = true;
    updateText.textContent = t('update.downloading');
    try { await invoke('install_update'); }   // 成功就重新啟動，不會回來
    catch (e) { updateText.textContent = t('update.failed') + String(e); updateGo.disabled = false; }
  });
  listen('update', e => {
    const { bytes, total } = e.payload;
    updateText.textContent = total
      ? t('update.progressOf', { a: mb(bytes), b: mb(total) })
      : t('update.progress', { a: mb(bytes) });
  });
  $('update-app').addEventListener('click', () => checkUpdate(true));

  (async () => {
    settings = await invoke('get_settings');
    applyLang(settings.language || systemLang());
    document.getElementById('dest').textContent = await invoke('out_dir');
    reset(await invoke('snapshot'));
    input.focus();
    checkUpdate(false);
  })();
})();
</script>
</body>
</html>
