<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunoDL</title>
<style>
  :root {
    color-scheme: dark;
    --rack:  #1b1f24;
    --panel: #23282f;
    --sunk:  #171b20;
    --edge:  #31383f;
    --ink:   #e6e9ec;
    --dim:   #8c959e;
    --lamp:  #e8a33d;
    --pass:  #6fbf8b;
    --fail:  #c4564b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
            "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--rack);
    color: var(--ink);
    font: 400 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- 輸入區
     視窗標題列已經寫著 SunoDL，所以頁面裡不再放一次招牌，
     輸入欄直接當開場，垂直空間全留給佇列。 */

  .intake {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--edge);
  }

  .field {
    position: relative;
    background: var(--sunk);
    border: 1px solid var(--edge);
    border-radius: 5px;
    transition: border-color 0.15s;
  }

  .field:focus-within { border-color: var(--lamp); }

  .field.dropping { border-color: var(--lamp); background: #1c2126; }

  textarea {
    display: block;
    width: 100%;
    height: 78px;
    padding: 10px 12px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    resize: none;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  textarea::placeholder { color: #6c757e; }

  .row-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 10px 9px 12px;
  }

  .hint {
    font-size: 11.5px;
    color: var(--dim);
  }

  button {
    padding: 5px 13px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--ink);
    font: 500 12.5px/1 var(--sans);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }

  button:hover:not(:disabled) { background: #2b3138; border-color: #3d454d; }
  button:active:not(:disabled) { background: #1f242a; }
  button:disabled { opacity: 0.45; cursor: default; }

  button.primary {
    border-color: #7a5a22;
    background: #3a2d14;
    color: var(--lamp);
  }
  button.primary:hover:not(:disabled) { background: #453518; border-color: #946c28; }

  /* 只給按鈕。textarea 的焦點已經由 .field:focus-within 的邊框表示，
     兩者都上就會出現兩層琥珀色框。 */
  button:focus-visible {
    outline: 2px solid var(--lamp);
    outline-offset: 1px;
  }

  /* ---------------------------------------------------------- 佇列 */

  #queue {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 4px 0;
  }

  /* margin:auto 在 column flex 裡會把唯一的子元素上下左右居中；
     一旦有曲目進來，.empty 隱藏，曲目就照常從頂端往下排 */
  .empty {
    margin: auto;
    padding: 0 18px;
    text-align: center;
    color: var(--dim);
    font-size: 12.5px;
  }

  .track {
    flex: none; /* 佇列變長時不要被 flex 壓扁 */
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 3px 14px;
    padding: 9px 18px 10px;
    border-bottom: 1px solid #262c33;
  }

  .name {
    grid-column: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }

  .stat {
    grid-column: 2;
    grid-row: 1;
    align-self: center;
    font-size: 12px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .track[data-status="done"]   .stat { color: var(--pass); }
  .track[data-status="failed"] .stat { color: var(--fail); }

  /* 分段式電平表 —— 這支工具的招牌，用 repeating gradient 畫成 LED 階梯，
     純 CSS 沒有 per-frame 計算 */
  .meter {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 5px;
    background: var(--sunk);
    border-radius: 1px;
    overflow: hidden;
  }

  .meter > i {
    display: block;
    width: 0;
    height: 100%;
    background: repeating-linear-gradient(90deg,
      var(--lamp) 0 3px, transparent 3px 5px);
    transition: width 0.18s linear;
  }

  /* 驗證中：滿格但調暗，表示資料到手、正在檢查 */
  .track[data-status="verifying"] .meter > i { opacity: 0.45; }

  .track[data-status="done"] .meter,
  .track[data-status="failed"] .meter,
  .track[data-status="queued"] .meter,
  .track[data-status="resolving"] .meter { display: none; }

  .why {
    grid-column: 1 / -1;
    grid-row: 3;
    font-size: 11.5px;
    color: var(--fail);
    -webkit-user-select: text;
    user-select: text;
  }

  /* ---------------------------------------------------------- 狀態列 */

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 10px;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
  }

  #dest {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    -webkit-user-select: text;
    user-select: text;
  }

  #tally {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #tally:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<section class="intake">
  <div class="field" id="field">
    <textarea id="input" spellcheck="false"
      placeholder="貼上 Suno 連結，一行一個"></textarea>
    <div class="row-actions">
      <span class="hint">單曲或清單都可以</span>
      <button class="primary" id="go">加入佇列</button>
    </div>
  </div>
</section>

<div id="queue">
  <p class="empty" id="empty">佇列是空的。貼上連結就會開始下載。</p>
</div>

<footer>
  <span id="dest">—</span>
  <span id="tally"></span>
  <button id="reveal">開啟資料夾</button>
  <button id="clear">清掉已完成</button>
</footer>

<script>
(() => {
  const { invoke } = window.__TAURI__.core;
  const { listen }  = window.__TAURI__.event;

  const queue = document.getElementById('queue');
  const empty = document.getElementById('empty');
  const input = document.getElementById('input');
  const field = document.getElementById('field');
  const go    = document.getElementById('go');
  const tally = document.getElementById('tally');

  /** id -> { item, el, refs }，只改動到的那一列，不重繪整張表 */
  const rows = new Map();

  const LABEL = {
    queued:      '等候中',
    resolving:   '解析中',
    downloading: '下載中',
    verifying:   '驗證中',
  };

  const mb = n => (n / 1048576).toFixed(1) + ' MB';

  const clock = s => {
    const t = Math.round(s);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  };

  function statLine(it) {
    switch (it.status) {
      case 'downloading':
        return it.total
          ? `${mb(it.bytes)} / ${mb(it.total)}`
          : mb(it.bytes);
      case 'done':
        return it.secs ? `已驗證 · ${clock(it.secs)}` : '已驗證';
      case 'failed':
        return '失敗';
      default:
        return LABEL[it.status] || it.status;
    }
  }

  function makeRow(it) {
    const el = document.createElement('div');
    el.className = 'track';
    el.innerHTML =
      '<span class="name"></span>' +
      '<span class="stat"></span>' +
      '<div class="meter"><i></i></div>' +
      '<span class="why"></span>';
    const refs = {
      name:  el.querySelector('.name'),
      stat:  el.querySelector('.stat'),
      fill:  el.querySelector('.meter > i'),
      why:   el.querySelector('.why'),
    };
    queue.appendChild(el);
    return { el, refs };
  }

  function paint(it) {
    let row = rows.get(it.id);
    if (!row) {
      row = makeRow(it);
      rows.set(it.id, row);
    }
    const { el, refs } = row;

    el.dataset.status = it.status;
    refs.name.textContent = it.title || it.input;
    refs.name.title = it.title || it.input;
    refs.stat.textContent = statLine(it);

    if (it.status === 'downloading' && it.total > 0) {
      refs.fill.style.width = Math.min(100, (it.bytes / it.total) * 100) + '%';
    } else if (it.status === 'verifying') {
      refs.fill.style.width = '100%';
    }

    refs.why.textContent = it.status === 'failed' ? (it.error || '') : '';
    refs.why.hidden = it.status !== 'failed';

    empty.hidden = rows.size > 0;
    updateTally();
  }

  function updateTally() {
    let running = 0, done = 0, failed = 0;
    for (const { el } of rows.values()) {
      const s = el.dataset.status;
      if (s === 'done') done++;
      else if (s === 'failed') failed++;
      else running++;
    }
    const parts = [];
    if (running) parts.push(`${running} 進行中`);
    if (done)    parts.push(`${done} 完成`);
    if (failed)  parts.push(`${failed} 失敗`);
    tally.textContent = parts.join(' · ');
  }

  function reset(items) {
    rows.clear();
    for (const el of [...queue.querySelectorAll('.track')]) el.remove();
    items.forEach(paint);
    empty.hidden = items.length > 0;
    updateTally();
  }

  async function submit() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    go.disabled = true;
    try {
      await invoke('add', { text });
      input.value = '';
    } catch (e) {
      // 後端把「看不懂輸入」當成錯誤回來，直接顯示在提示位置
      const hint = document.querySelector('.hint');
      hint.textContent = String(e);
      hint.style.color = 'var(--fail)';
      setTimeout(() => {
        hint.textContent = '單曲或清單都可以';
        hint.style.color = '';
      }, 4000);
    } finally {
      go.disabled = false;
      input.focus();
    }
  }

  go.addEventListener('click', submit);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  });

  // 拖網址進視窗
  ['dragenter', 'dragover'].forEach(t =>
    field.addEventListener(t, e => { e.preventDefault(); field.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(t =>
    field.addEventListener(t, () => field.classList.remove('dropping')));
  field.addEventListener('drop', e => {
    e.preventDefault();
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (!text) return;
    input.value = input.value ? input.value + '\n' + text : text;
    submit();
  });

  document.getElementById('reveal').addEventListener('click', () => invoke('open_out_dir'));
  document.getElementById('clear').addEventListener('click', async () => {
    reset(await invoke('clear_done'));
  });

  listen('item', e => paint(e.payload));

  (async () => {
    document.getElementById('dest').textContent = await invoke('out_dir');
    reset(await invoke('snapshot'));
    input.focus();
  })();
})();
</script>
</body>
</html>
