<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haul</title>
<style>
  :root {
    color-scheme: dark;
    --rack:  #1b1f24;
    --panel: #23282f;
    --sunk:  #171b20;
    --edge:  #31383f;
    --ink:   #e6e9ec;
    --dim:   #8c959e;
    --lamp:  #e8a33d;
    --pass:  #6fbf8b;
    --fail:  #c4564b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
            "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    background: var(--rack);
    color: var(--ink);
    font: 400 13px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- 輸入區
     視窗標題列已經寫著 Haul，所以頁面裡不再放一次招牌，
     輸入欄直接當開場，垂直空間全留給佇列。 */

  .intake {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--edge);
  }

  .field {
    position: relative;
    background: var(--sunk);
    border: 1px solid var(--edge);
    border-radius: 5px;
    transition: border-color 0.15s;
  }

  .field:focus-within { border-color: var(--lamp); }

  .field.dropping { border-color: var(--lamp); background: #1c2126; }

  textarea {
    display: block;
    width: 100%;
    height: 78px;
    padding: 10px 12px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    resize: none;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  textarea::placeholder { color: #6c757e; }

  .row-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 10px 9px 12px;
  }

  .hint {
    margin: 8px 2px 0;
    font-size: 11.5px;
    color: var(--dim);
  }

  .hint.bad { color: var(--fail); }

  /* 影片 / 只要聲音 —— 分段切換，安靜地待在輸入欄底部 */
  select {
    margin-left: auto;
    margin-right: 10px;
    padding: 4px 6px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1 var(--sans);
  }

  select:hover { color: var(--ink); }

  .modes {
    display: flex;
    border: 1px solid var(--edge);
    border-radius: 4px;
    overflow: hidden;
  }

  .mode {
    border: 0;
    border-radius: 0;
    padding: 4px 11px;
    background: none;
    color: var(--dim);
    font: 500 12px/1 var(--sans);
  }

  .mode + .mode { border-left: 1px solid var(--edge); }
  .mode:hover:not(.on) { background: #2b3138; color: var(--ink); }
  .mode.on { background: #3a2d14; color: var(--lamp); }

  /* 首次啟動抓 yt-dlp 與 ffmpeg 時的進度 */
  #setup {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 18px 11px;
    border-bottom: 1px solid var(--edge);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
  }

  #setup .meter {
    flex: 1;
    min-width: 60px;
    height: 5px;
    background: var(--sunk);
    border-radius: 1px;
    overflow: hidden;
  }

  #setup .meter > i {
    display: block;
    width: 0;
    height: 100%;
    background: repeating-linear-gradient(90deg,
      var(--lamp) 0 3px, transparent 3px 5px);
    transition: width 0.2s linear;
  }

  button {
    padding: 5px 13px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--ink);
    font: 500 12.5px/1 var(--sans);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }

  button:hover:not(:disabled) { background: #2b3138; border-color: #3d454d; }
  button:active:not(:disabled) { background: #1f242a; }
  button:disabled { opacity: 0.45; cursor: default; }

  button.primary {
    border-color: #7a5a22;
    background: #3a2d14;
    color: var(--lamp);
  }
  button.primary:hover:not(:disabled) { background: #453518; border-color: #946c28; }

  /* 只給按鈕。textarea 的焦點已經由 .field:focus-within 的邊框表示，
     兩者都上就會出現兩層琥珀色框。 */
  button:focus-visible {
    outline: 2px solid var(--lamp);
    outline-offset: 1px;
  }

  /* ---------------------------------------------------------- 佇列 */

  #queue {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 4px 0;
  }

  /* margin:auto 在 column flex 裡會把唯一的子元素上下左右居中；
     一旦有曲目進來，.empty 隱藏，曲目就照常從頂端往下排 */
  .empty {
    margin: auto;
    padding: 0 18px;
    text-align: center;
    color: var(--dim);
    font-size: 12.5px;
  }

  .track {
    flex: none; /* 佇列變長時不要被 flex 壓扁 */
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 3px 14px;
    padding: 9px 18px 10px;
    border-bottom: 1px solid #262c33;
  }

  .name {
    grid-column: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }

  .stat {
    grid-column: 2;
    grid-row: 1;
    align-self: center;
    font-size: 12px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .track[data-status="done"]   .stat { color: var(--pass); }
  .track[data-status="failed"] .stat { color: var(--fail); }

  /* 抓下來就該能播，所以完成的項目點一下直接用系統播放器開啟 */
  .track[data-status="done"] { cursor: pointer; }
  .track[data-status="done"]:hover { background: #20262c; }

  /* 分段式電平表 —— 這支工具的招牌，用 repeating gradient 畫成 LED 階梯，
     純 CSS 沒有 per-frame 計算 */
  .meter {
    grid-column: 1 / -1;
    grid-row: 2;
    height: 5px;
    background: var(--sunk);
    border-radius: 1px;
    overflow: hidden;
  }

  .meter > i {
    display: block;
    width: 0;
    height: 100%;
    background: repeating-linear-gradient(90deg,
      var(--lamp) 0 3px, transparent 3px 5px);
    transition: width 0.18s linear;
  }

  /* 驗證中：滿格但調暗，表示資料到手、正在檢查 */
  .track[data-status="verifying"] .meter > i { opacity: 0.45; }

  .track[data-status="done"] .meter,
  .track[data-status="failed"] .meter,
  .track[data-status="queued"] .meter,
  .track[data-status="resolving"] .meter { display: none; }

  .why {
    grid-column: 1 / -1;
    grid-row: 3;
    font-size: 11.5px;
    color: var(--fail);
    -webkit-user-select: text;
    user-select: text;
  }

  /* 萃取失敗但瀏覽器可能救得了：給一顆安靜的行內按鈕，不彈視窗、不自動接手 */
  .act {
    grid-column: 1 / -1;
    grid-row: 4;
    justify-self: start;
    margin-top: 4px;
    padding: 3px 9px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1.4 var(--sans);
    cursor: pointer;
  }
  .act:hover { color: var(--ink); background: #2b3138; }
  /* 瀏覽器偵測不到時，錄製是唯一出路，讓它明顯一點 */
  .act.primary { color: var(--lamp); border-color: #4a3a18; }

  /* 瀏覽器偵測到的候選。自動挑的那個標出來，其餘可以另外抓 */
  .cands {
    grid-column: 1 / -1;
    grid-row: 5;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .cand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .cand .url {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl; /* 網址尾巴比開頭有資訊，截開頭不截尾 */
    text-align: left;
    flex: 1;
  }
  .cand .pick {
    padding: 1px 7px;
    border: 1px solid var(--edge);
    border-radius: 3px;
    background: transparent;
    color: var(--dim);
    font: 11px/1.4 var(--sans);
    cursor: pointer;
  }
  .cand .pick:hover { color: var(--ink); }
  .cand.on { color: var(--lamp); }

  .track[data-status="browser"] .meter > i { width: 100%; opacity: 0.25; }

  /* ---------------------------------------------------------- 狀態列 */

  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 10px;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    font-size: 12px;
    color: var(--dim);
  }

  #dest {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    -webkit-user-select: text;
    user-select: text;
  }

  #tally {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #tally:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------------------------------------------------------- 設定面板 */

  dialog#settings {
    width: min(520px, 92vw);
    max-height: 88vh;
    padding: 0;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
  }
  dialog#settings::backdrop { background: rgba(0, 0, 0, 0.5); }

  .sheet {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 20px 16px;
    overflow-y: auto;
  }
  .sheet h2 { margin: 0; font-size: 15px; font-weight: 600; }

  .sheet fieldset {
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 0;
  }
  .sheet legend { padding: 0 6px; color: var(--dim); font-size: 12px; }

  .sheet label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .sheet label.check { gap: 8px; }
  .sheet label.pathrow, .sheet .pathrow { flex-wrap: wrap; }

  .sheet .path {
    flex: 1;
    min-width: 120px;
    color: var(--dim);
    font: 12px var(--mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    direction: rtl;
    text-align: left;
  }
  .sheet .note { color: var(--dim); font-size: 11.5px; }

  .sheet select, .sheet input[type="number"] {
    padding: 4px 6px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--sunk);
    color: var(--ink);
    font: 500 12px/1 var(--sans);
  }
  .sheet input[type="number"] { width: 64px; }

  .sheet button {
    padding: 4px 10px;
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: var(--panel);
    color: var(--dim);
    font: 500 12px/1.4 var(--sans);
    cursor: pointer;
  }
  .sheet button:hover { color: var(--ink); background: #2b3138; }
  .sheet button.primary { background: var(--lamp); color: #1a1200; border-color: var(--lamp); }

  .sheet-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
</style>
</head>
<body>

<section class="intake">
  <div class="field" id="field">
    <textarea id="input" spellcheck="false"
      placeholder="貼上影片或音樂的連結，一行一個"></textarea>
    <div class="row-actions">
      <div class="modes" role="radiogroup" aria-label="要下載什麼">
        <button type="button" class="mode on" data-mode="video" role="radio" aria-checked="true">影片</button>
        <button type="button" class="mode" data-mode="audio" role="radio" aria-checked="false">只要聲音</button>
      </div>
      <button class="primary" id="go">加入佇列</button>
    </div>
  </div>
  <p class="hint" id="hint">單支或整份清單都可以</p>
</section>

<div id="setup" hidden>
  <span id="setup-text">正在準備下載工具…</span>
  <div class="meter"><i id="setup-fill"></i></div>
</div>

<div id="queue">
  <p class="empty" id="empty">佇列是空的。貼上連結就會開始下載。</p>
</div>

<footer>
  <span id="dest">—</span>
  <span id="tally"></span>
  <button id="gear" title="設定">⚙</button>
  <button id="reveal">開啟資料夾</button>
  <button id="clear">清掉已完成</button>
</footer>

<dialog id="settings">
  <form method="dialog" class="sheet">
    <h2>設定</h2>

    <fieldset>
      <legend>下載</legend>
      <label class="pathrow">輸出資料夾
        <span id="set-out" class="path">預設</span>
        <button type="button" id="set-out-pick">選擇…</button>
        <span class="note">重新啟動後生效</span>
      </label>
      <label>畫質上限
        <select id="set-quality">
          <option value="">不設限</option>
          <option value="2160">2160p</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
        </select>
      </label>
      <label>同時下載數
        <input type="number" id="set-concurrency" min="1" max="8">
        <span class="note">重新啟動後生效</span>
      </label>
      <label class="check"><input type="checkbox" id="set-chime-on"> 佇列完成時播放提示音</label>
      <div class="pathrow" id="chime-file-row">
        <span id="set-chime-file" class="path">內建提示音</span>
        <button type="button" id="chime-pick">選檔…</button>
        <button type="button" id="chime-clear">改回內建</button>
        <button type="button" id="chime-test">試聽</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>登入</legend>
      <label>登入狀態來源
        <select id="set-cookies">
          <option value="">不用登入</option>
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="safari">Safari</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
        </select>
      </label>
      <p class="note">Haul 不碰帳密，只借用瀏覽器已有的登入狀態。</p>
    </fieldset>

    <fieldset>
      <legend>瀏覽器 / 錄製</legend>
      <label class="pathrow">瀏覽器路徑
        <span id="set-browser" class="path">自動偵測</span>
        <button type="button" id="browser-pick">選擇…</button>
        <button type="button" id="browser-clear">自動</button>
      </label>
      <label>錄製上限（分鐘）
        <input type="number" id="set-record-max" min="1">
      </label>
    </fieldset>

    <fieldset>
      <legend>工具</legend>
      <button type="button" id="update" title="各站改版時靠這個跟上">更新 yt-dlp</button>
    </fieldset>

    <div class="sheet-actions">
      <button type="button" id="set-cancel">取消</button>
      <button type="button" id="set-save" class="primary">儲存</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const { invoke } = window.__TAURI__.core;
  const { listen }  = window.__TAURI__.event;

  const queue = document.getElementById('queue');
  const empty = document.getElementById('empty');
  const input = document.getElementById('input');
  const field = document.getElementById('field');
  const go    = document.getElementById('go');
  const tally = document.getElementById('tally');

  /** id -> { item, el, refs }，只改動到的那一列，不重繪整張表 */
  const rows = new Map();

  const LABEL = {
    queued:      '等候中',
    resolving:   '解析中',
    browser:     '瀏覽器偵測中 · 頁面要按播放的話請在視窗裡按',
    recording:   '錄製中 · 在瀏覽器視窗裡播放要錄的內容',
    downloading: '下載中',
    verifying:   '驗證中',
  };

  const mb = n => (n / 1048576).toFixed(1) + ' MB';

  const clock = s => {
    const t = Math.round(s);
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  };

  function statLine(it) {
    switch (it.status) {
      case 'downloading':
        return it.total
          ? `${mb(it.bytes)} / ${mb(it.total)}`
          : mb(it.bytes);
      case 'browser':
        return it.total ? `偵測到 ${it.total} 個媒體` : LABEL.browser;
      case 'recording':
        return it.bytes ? `● ${clock(it.secs || 0)} · ${mb(it.bytes)}` : LABEL.recording;
      case 'done': {
        const tag = it.source === 'recording' ? '已驗證 · 錄製' : '已驗證';
        return it.secs ? `${tag} · ${clock(it.secs)}` : tag;
      }
      case 'failed':
        return '失敗';
      default:
        return LABEL[it.status] || it.status;
    }
  }

  function makeRow(it) {
    const el = document.createElement('div');
    el.className = 'track';
    el.innerHTML =
      '<span class="name"></span>' +
      '<span class="stat"></span>' +
      '<div class="meter"><i></i></div>' +
      '<span class="why"></span>' +
      '<button type="button" class="act" hidden>用瀏覽器抓</button>' +
      '<button type="button" class="act act2" hidden></button>' +
      '<div class="cands" hidden></div>';
    const refs = {
      name:  el.querySelector('.name'),
      stat:  el.querySelector('.stat'),
      fill:  el.querySelector('.meter > i'),
      why:   el.querySelector('.why'),
      act:   el.querySelector('.act:not(.act2)'),
      act2:  el.querySelector('.act2'),
      cands: el.querySelector('.cands'),
    };
    refs.act.addEventListener('click', ev => {
      ev.stopPropagation();
      refs.act.disabled = true;
      invoke('retry_with_browser', { id: it.id }).catch(err => say(String(err), true));
    });
    // act2 身兼「改用錄製」與「停止」，依當下狀態決定送哪個指令
    refs.act2.addEventListener('click', ev => {
      ev.stopPropagation();
      const cmd = el.dataset.status === 'recording' ? 'stop_recording' : 'record_item';
      refs.act2.disabled = true;
      invoke(cmd, { id: it.id }).catch(err => say(String(err), true));
    });
    queue.appendChild(el);
    return { el, refs };
  }

  function paint(it) {
    let row = rows.get(it.id);
    if (!row) {
      row = makeRow(it);
      rows.set(it.id, row);
    }
    const { el, refs } = row;

    el.dataset.status = it.status;
    refs.name.textContent = it.title || it.input;
    refs.name.title = it.title || it.input;
    refs.stat.textContent = statLine(it);

    if (it.status === 'downloading' && it.total > 0) {
      refs.fill.style.width = Math.min(100, (it.bytes / it.total) * 100) + '%';
    } else if (it.status === 'verifying') {
      refs.fill.style.width = '100%';
    }

    if (it.path) el.dataset.path = it.path;
    el.title = it.status === 'done' && it.path ? '點一下播放' : '';

    refs.why.textContent = it.status === 'failed' ? (it.error || '') : '';
    refs.why.hidden = it.status !== 'failed';

    // 只有萃取類的失敗才給這顆；401 / 429 / 驗證失敗開瀏覽器也救不了
    refs.act.hidden = !(it.status === 'failed' && it.canBrowser);
    refs.act.disabled = false;
    // act2：錄製中→停止；可改用錄製的失敗→改用錄製（瀏覽器也救不了時是唯一出路）
    if (it.status === 'recording') {
      refs.act2.hidden = false;
      refs.act2.disabled = false;
      refs.act2.textContent = '停止';
      refs.act2.classList.remove('primary');
    } else if (it.status === 'failed' && it.canRecord) {
      refs.act2.hidden = false;
      refs.act2.disabled = false;
      refs.act2.textContent = it.kind === 'audio' ? '改用錄製（只要聲音）' : '改用錄製';
      refs.act2.classList.toggle('primary', !it.canBrowser);
    } else {
      refs.act2.hidden = true;
    }
    if (it.status !== 'browser' && it.status !== 'downloading' &&
        it.status !== 'verifying' && it.status !== 'done') {
      refs.cands.hidden = true;
    }

    empty.hidden = rows.size > 0;
    updateTally();
  }

  function updateTally() {
    let running = 0, done = 0, failed = 0;
    for (const { el } of rows.values()) {
      const s = el.dataset.status;
      if (s === 'done') done++;
      else if (s === 'failed') failed++;
      else running++;
    }
    const parts = [];
    if (running) parts.push(`${running} 進行中`);
    if (done)    parts.push(`${done} 完成`);
    if (failed)  parts.push(`${failed} 失敗`);
    tally.textContent = parts.join(' · ');

    // 進行中的數量從 >0 掉到 0：佇列清空了，響一次。
    // prevRunning 一開始是 null，載入 snapshot 那次不會誤響。
    if (prevRunning !== null && prevRunning > 0 && running === 0) playChime();
    prevRunning = running;
  }
  let prevRunning = null;

  function reset(items) {
    rows.clear();
    for (const el of [...queue.querySelectorAll('.track')]) el.remove();
    items.forEach(paint);
    empty.hidden = items.length > 0;
    updateTally();
  }

  const hint = document.getElementById('hint');
  const HINT_DEFAULT = '單支或整份清單都可以';
  let mode = 'video';

  for (const b of document.querySelectorAll('.mode')) {
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      for (const other of document.querySelectorAll('.mode')) {
        const on = other === b;
        other.classList.toggle('on', on);
        other.setAttribute('aria-checked', String(on));
      }
    });
  }

  function say(msg, bad) {
    hint.textContent = msg;
    hint.classList.toggle('bad', !!bad);
    if (msg !== HINT_DEFAULT) {
      clearTimeout(say.t);
      say.t = setTimeout(() => say(HINT_DEFAULT, false), 5000);
    }
  }

  async function submit() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    go.disabled = true;
    try {
      // 登入來源與預設畫質從設定面板帶，不再是輸入欄旁的下拉
      await invoke('add', {
        text,
        mode,
        cookies: settings.cookiesFrom || null,
        quality: settings.maxHeight ?? null,
      });
      input.value = '';
    } catch (e) {
      // 後端把「看不懂輸入」當成錯誤回來，顯示在提示位置
      say(String(e), true);
    } finally {
      go.disabled = false;
      input.focus();
    }
  }

  go.addEventListener('click', submit);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
  });

  // 拖網址進視窗
  ['dragenter', 'dragover'].forEach(t =>
    field.addEventListener(t, e => { e.preventDefault(); field.classList.add('dropping'); }));
  ['dragleave', 'drop'].forEach(t =>
    field.addEventListener(t, () => field.classList.remove('dropping')));
  field.addEventListener('drop', e => {
    e.preventDefault();
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (!text) return;
    input.value = input.value ? input.value + '\n' + text : text;
    submit();
  });

  document.getElementById('reveal').addEventListener('click', () => invoke('open_out_dir'));
  document.getElementById('clear').addEventListener('click', async () => {
    reset(await invoke('clear_done'));
  });

  // 完成的項目點一下就播放。用委派監聽，佇列再長也只有一個 listener。
  queue.addEventListener('click', e => {
    const row = e.target.closest('.track');
    if (!row || row.dataset.status !== 'done' || !row.dataset.path) return;
    invoke('open_file', { path: row.dataset.path })
      .catch(err => say(String(err), true));
  });

  // 首次啟動要抓 yt-dlp 與 ffmpeg（約 80MB），把進度顯示出來，
  // 不然使用者只會看到一個沒反應的視窗
  const setup = document.getElementById('setup');
  const setupText = document.getElementById('setup-text');
  const setupFill = document.getElementById('setup-fill');

  // 已經動用到 yt-dlp / ffmpeg 的狀態。resolving 不算 —— 那時工具可能還在下載。
  const NEEDS_TOOLS = new Set(['browser', 'recording', 'downloading', 'verifying', 'done']);

  listen('item', e => {
    paint(e.payload);
    // 走到這些狀態就代表工具已經就緒。單靠 done 事件的話，只要那則事件
    // 沒送到（例如被進度事件淹沒），進度列就會永遠留在畫面上。
    if (NEEDS_TOOLS.has(e.payload.status)) setup.hidden = true;
  });

  const kb = n => n == null ? '' : (n >= 1048576 ? mb(n) : (n / 1024).toFixed(0) + ' KB');

  // 瀏覽器偵測到的候選：自動挑的標「已選」，其餘給「抓這個」——
  // 那會新增一個項目，不會取消正在跑的
  listen('candidates', e => {
    const { id, candidates, chosen } = e.payload;
    const row = rows.get(id);
    if (!row) return;
    const box = row.refs.cands;
    box.textContent = '';
    candidates.forEach((c, i) => {
      const line = document.createElement('div');
      line.className = 'cand' + (i === chosen ? ' on' : '');
      const kind = c.kind === 'manifest' ? '串流清單' : '單檔';
      line.innerHTML =
        `<span>${i === chosen ? '已選' : '　　'}</span>` +
        `<span>${kind}</span>` +
        `<span>${kb(c.size)}</span>` +
        `<span class="url"></span>` +
        (i === chosen ? '' : '<button type="button" class="pick">抓這個</button>');
      line.querySelector('.url').textContent = c.url;
      line.querySelector('.url').title = c.url;
      const pick = line.querySelector('.pick');
      if (pick) pick.addEventListener('click', ev => {
        ev.stopPropagation();
        pick.disabled = true;
        invoke('add_candidate', { id, candidate: c }).catch(err => say(String(err), true));
      });
      box.appendChild(line);
    });
    box.hidden = candidates.length === 0;
  });

  listen('setup', e => {
    const s = e.payload;
    if (s.stage === 'done') { setup.hidden = true; return; }
    setup.hidden = false;
    if (s.stage === 'failed') {
      setupText.textContent = '準備工具失敗：' + (s.error || '原因不明');
      setupFill.style.width = '0';
      return;
    }
    const mbTotal = s.total ? ` ${mb(s.bytes)} / ${mb(s.total)}` : '';
    setupText.textContent = `首次啟動，正在取得 ${s.tool}${mbTotal}`;
    setupFill.style.width = s.total ? (s.bytes / s.total) * 100 + '%' : '0';
  });

  document.getElementById('update').addEventListener('click', async (ev) => {
    ev.target.disabled = true;
    say('正在更新 yt-dlp…', false);
    try {
      const out = await invoke('update_tools');
      say(out || 'yt-dlp 已是最新版', false);
    } catch (e) {
      say('更新失敗：' + String(e), true);
    } finally {
      ev.target.disabled = false;
    }
  });

  // ---------------------------------------------------------- 設定面板

  // add 送出時要用的設定，App 啟動與每次存檔後同步
  let settings = {};

  let audioCtx;
  function ctx() {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  // 內建提示音：兩個短音，純合成，不需資源
  function beep() {
    try {
      const c = ctx(), now = c.currentTime;
      [880, 1320].forEach((f, i) => {
        const o = c.createOscillator(), g = c.createGain();
        o.frequency.value = f; o.connect(g); g.connect(c.destination);
        const t = now + i * 0.12;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        o.start(t); o.stop(t + 0.12);
      });
    } catch (_) {}
  }
  async function playFile(path) {
    // 後端讀位元組回 base64，前端解碼播放，不必開 asset protocol 白名單
    const b64 = await invoke('read_audio', { path });
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const buf = await ctx().decodeAudioData(bytes.buffer);
    const src = ctx().createBufferSource();
    src.buffer = buf; src.connect(ctx().destination); src.start();
  }
  async function playChime() {
    if (!settings.chime || !settings.chime.enabled) return;
    if (!settings.chime.file) return beep();
    try { await playFile(settings.chime.file); }
    catch (_) { beep(); } // 檔案不見或解不動就退回內建
  }

  const dlg = document.getElementById('settings');
  const $ = id => document.getElementById(id);
  // 面板上暫存的路徑（按儲存才寫回）
  let draftChimeFile = null, draftBrowserPath = null, draftOutDir = null;

  function showPath(el, val, fallback) {
    el.textContent = val || fallback;
    el.title = val || fallback;
  }

  function fillPanel(s) {
    $('set-quality').value = s.maxHeight != null ? String(s.maxHeight) : '';
    $('set-concurrency').value = s.concurrency;
    $('set-cookies').value = s.cookiesFrom || '';
    $('set-record-max').value = Math.round((s.recordMaxSecs || 10800) / 60);
    $('set-chime-on').checked = !!(s.chime && s.chime.enabled);
    draftChimeFile = (s.chime && s.chime.file) || null;
    draftBrowserPath = s.browserPath || null;
    draftOutDir = s.outDir || null;
    showPath($('set-out'), s.outDir, '預設（~/Downloads/Haul）');
    showPath($('set-chime-file'), draftChimeFile, '內建提示音');
    showPath($('set-browser'), draftBrowserPath, '自動偵測');
  }

  $('gear').addEventListener('click', async () => {
    fillPanel(await invoke('get_settings'));
    dlg.showModal();
  });
  $('set-cancel').addEventListener('click', () => dlg.close());

  $('set-out-pick').addEventListener('click', async () => {
    const path = await invoke('pick_folder');
    if (path) { draftOutDir = path; showPath($('set-out'), path, '預設（~/Downloads/Haul）'); }
  });

  $('chime-pick').addEventListener('click', async () => {
    const path = await invoke('pick_audio_file');
    if (!path) return;
    try {
      await invoke('verify_audio', { path });
      draftChimeFile = path;
      showPath($('set-chime-file'), path, '內建提示音');
      $('set-chime-on').checked = true;
    } catch (e) { say(String(e), true); }
  });
  $('chime-clear').addEventListener('click', () => {
    draftChimeFile = null;
    showPath($('set-chime-file'), null, '內建提示音');
  });
  $('chime-test').addEventListener('click', async () => {
    if (draftChimeFile) { try { await playFile(draftChimeFile); return; } catch (_) {} }
    beep();
  });

  $('browser-pick').addEventListener('click', async () => {
    const path = await invoke('pick_audio_file'); // 同一個原生選檔器，選任意檔
    if (path) { draftBrowserPath = path; showPath($('set-browser'), path, '自動偵測'); }
  });
  $('browser-clear').addEventListener('click', () => {
    draftBrowserPath = null;
    showPath($('set-browser'), null, '自動偵測');
  });

  $('set-save').addEventListener('click', async () => {
    const q = $('set-quality').value;
    const next = {
      outDir: draftOutDir,                       // 改了要重啟才生效（見面板上的註記）
      maxHeight: q ? Number(q) : null,
      concurrency: Math.max(1, Math.min(8, Number($('set-concurrency').value) || 3)),
      cookiesFrom: $('set-cookies').value || null,
      browserPath: draftBrowserPath,
      recordMaxSecs: Math.max(1, Number($('set-record-max').value) || 180) * 60,
      chime: { enabled: $('set-chime-on').checked, file: draftChimeFile },
    };
    try {
      await invoke('save_settings', { settings: next });
      settings = next;
      dlg.close();
    } catch (e) { say('存不了設定：' + String(e), true); }
  });

  (async () => {
    settings = await invoke('get_settings');
    document.getElementById('dest').textContent = await invoke('out_dir');
    reset(await invoke('snapshot'));
    input.focus();
  })();
})();
</script>
</body>
</html>
