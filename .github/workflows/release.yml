name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 一個 Universal 2 的 .dmg 就同時支援 Intel 與 Apple Silicon，
          # 使用者不必自己判斷該下載哪一個
          - label: macOS (Universal)
            os: macos-latest
            target: universal-apple-darwin
            toolchains: aarch64-apple-darwin,x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            toolchains: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchains }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 的 minisign 私鑰（公鑰在 tauri.conf.json）。沒有它就簽不了更新包，
          # 已裝的 app 會拒絕安裝。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # 產 latest.json 給 app 自我更新用；release 發布後才會從 latest/download 拿得到
          includeUpdaterJson: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-dev-{0}', github.run_number) }}
          releaseName: Haul ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          releaseBody: |
            macOS 下載 `.dmg`（Intel 與 Apple Silicon 通用），Windows 下載 `.exe` 安裝檔。

            兩邊都沒有做程式碼簽章，所以首次開啟需要放行：
            - macOS：於「系統設定 → 隱私權與安全性」按「仍要打開」
            - Windows：SmartScreen 出現時選「更多資訊 → 仍要執行」

            從這版起 app 會自己檢查更新（設定 → 檢查 Haul 更新）；v0.1.0 沒有這個功能，請手動下載一次。
          releaseDraft: true
          prerelease: false

      # CLI 是給腳本與 AI agent 用的介面，也要能拿得到，
      # 不然使用者只有 GUI 沒有 haul 指令
      - name: build CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Tauri 會自己把 GUI lipo 成 universal，但 cargo build 只建主機
            # 架構。不自己合併的話，檔名承諾 universal 卻只有 arm64，
            # Intel Mac 下載後會是「Bad CPU type in executable」。
            cargo build --release -p haul-cli --target aarch64-apple-darwin
            cargo build --release -p haul-cli --target x86_64-apple-darwin
            lipo -create -output haul-cli-universal \
              target/aarch64-apple-darwin/release/haul \
              target/x86_64-apple-darwin/release/haul
            lipo -info haul-cli-universal
          else
            cargo build --release -p haul-cli
          fi

      - name: attach CLI to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            src=target/release/haul.exe
            dst=haul-${{ matrix.target }}.exe
          else
            src=haul-cli-universal
            dst=haul-${{ matrix.target }}
          fi
          cp "$src" "$dst"
          gh release upload "${{ github.ref_name }}" "$dst" --clobber
