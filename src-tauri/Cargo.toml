[package]
name = "sunodl"
version = "0.1.0"
description = "Suno 下載器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
futures-util = "0.3"

# rustls 而非 OpenSSL：Windows 上不需要額外裝任何東西就能編譯
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "http2",
    "charset",
] }

# 純 Rust 解碼，驗證音檔能不能播，不依賴 ffmpeg
symphonia = { version = "0.5", features = ["mp3", "isomp4", "aac"] }

[profile.release]
# 解碼是這支程式唯一吃 CPU 的地方，所以優化速度而不是體積。
# 刻意不設 panic = "abort"：驗證跑在 spawn_blocking 上，靠 unwinding
# 才能把畸形檔案造成的 panic 收成「這一首失敗」，而不是整個 app 掛掉。
opt-level = 3
lto = true
codegen-units = 1
strip = true
